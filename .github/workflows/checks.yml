name: Cost checks

# Runs on GitHub's machines, never on the van's Pi. See checks/cost.mjs.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'checks/**'
      - '.github/workflows/checks.yml'

permissions:
  contents: read

jobs:
  cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches the Pi
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Check cost
        run: node checks/cost.mjs
