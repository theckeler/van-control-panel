<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Older iOS only opens a Home Screen icon as an app with this name. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#f3f4f6" />
    <title>Van Control</title>
    <meta
      name="description"
      content="A self-hosted monitoring and control dashboard for a Sprinter van conversion, running on a Raspberry Pi."
    />
    <!-- Link previews. Crawlers need an absolute URL for the image, so this
         points at the Vercel demo's public alias. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Van Control Panel" />
    <meta
      property="og:description"
      content="A self-hosted monitoring and control dashboard for a Sprinter van conversion, running on a Raspberry Pi."
    />
    <meta
      property="og:image"
      content="https://van-control-panel.vercel.app/social-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/van.svg" />
    <script>
      (function () {
        // Light only for now. When dark mode is built, this is where the
        // saved choice gets applied before first paint.
        document.documentElement.dataset.theme = "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
