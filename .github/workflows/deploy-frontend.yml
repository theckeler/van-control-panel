name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: [self-hosted, van-pi]

    steps:
      - name: Pull latest code
        working-directory: /home/todd/van-control-panel
        run: git pull origin main

      - name: Install Node dependencies
        working-directory: /home/todd/van-control-panel/frontend
        run: npm ci --prefer-offline

      - name: Build
        working-directory: /home/todd/van-control-panel/frontend
        run: npm run build

      - name: Restart frontend service
        run: sudo systemctl restart van-frontend
