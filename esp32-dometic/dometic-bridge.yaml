esphome:
  name: dometic-bridge
  friendly_name: Dometic Bridge

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  # Was a single OHeck-only network. The Pi's own dispatcher actively prefers
  # Starlink and doesn't stay put — it drops back to Starlink roughly every
  # 30 minutes once its manual-override window expires, at which point the
  # Pi and this board end up on different networks and the fridge card goes
  # unreachable, even though nothing is actually wrong. Listing both networks
  # here lets the ESP32 join whichever the Pi is currently on, same as the
  # Pi's own Starlink-primary/OHeck-fallback setup.
  # Explicit priority, not list order — checked ESPHome's own wifi_component
  # source (WIFI_NETWORK_STA schema, priority: -128..127, default 0, higher
  # tried first during a scan-based reconnect). Without it, selection between
  # two equally-fresh networks falls through to RSSI, which is not the same
  # as "always prefer Starlink". This makes it deterministic.
  networks:
    - ssid: !secret starlink_ssid
      password: !secret starlink_password
      priority: 1
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  # fast_connect was true. It has a "reconnect to the BSSID from the
  # previous boot" shortcut that can bypass priority-based scan sorting
  # entirely — suspected root cause, 2026-08-28, of a fresh flash landing
  # back on OHeck even with Starlink confirmed broadcasting at full signal.
  # That flash only touched the interval: logic, not this wifi: block, so
  # the cached OHeck BSSID from moments earlier likely survived and won
  # before priority was ever consulted. Disabled to force a genuine
  # scan-and-sort on every reconnect — slower, but this only matters for
  # the rare case (interval below, or an actual disconnect), where
  # correctness matters far more than a few seconds of boot speed.
  fast_connect: false

  ap:
    ssid: "Dometic-Bridge-Fallback"
    password: !secret fallback_ap_password

# Closes the gap the priority: fix above doesn't: ESPHome only re-evaluates
# the network list on an actual disconnect, never proactively while already
# connected — confirmed by direct test 2026-08-27, switching the Pi to
# Starlink and watching this board sit on OHeck for 60+ seconds doing
# nothing. Mirrors the Pi's own 90-prefer-starlink dispatcher, but ESPHome
# has no "network came into range" event to hook, so this polls instead.
#
# Only acts when NOT already on Starlink, so the common case (already on the
# preferred network) never touches WiFi at all.
#
# First attempt used wifi.disable + wifi.enable — logically reasonable, but
# proven wrong by direct test 2026-08-28: with Starlink confirmed broadcasting
# at full strength (verified independently via the Pi's own scan, signal 97),
# the interval fired correctly (watched the log line print live) but landed
# right back on OHeck anyway. disable/enable doesn't force the same
# priority-sorted scan a real boot does — some faster reconnect-to-last-known
# path wins instead. A genuine reboot is the only mechanism actually verified
# (twice, independently) to respect priority correctly, so this uses that —
# heavier per-occurrence, but it only fires when already stuck on the
# fallback network, which should be rare in steady state.
interval:
  - interval: 5min
    then:
      - if:
          condition:
            lambda: 'return id(current_ssid).state != "Sir Salettelot";'
          then:
            - logger.log: "Not on Starlink — rebooting to force a priority-sorted reconnect"
            - lambda: 'App.safe_reboot();'

logger:
  level: VERBOSE

api:
  encryption:
    key: "4jqLcf3DaUMClV30PR5ifiJIJaeLWGhCYLqPpoWytJM=" # esphome will prompt to generate on first run

ota:
  - platform: esphome

esp32_ble_tracker:
  scan_parameters:
    # Previously interval == window (320ms/320ms) = 100% duty-cycle active
    # scanning, transmitting scan requests nonstop. The ESP32 and Pi share
    # the same van and the same 2.4GHz spectrum the Pi's own BLE connection
    # to the BMS depends on. This gives real rest between scans instead of
    # contending for airtime constantly.
    interval: 1100ms
    window: 30ms
    active: true

# Switched 2026-08-27 from the locally-vendored CFX3 component to the CFX5
# fork. See docs/rubber-duck-review-2026-08-27.md for the full reasoning.
#
# Short version: 537a03xx and 537a04xx are not the same protocol at different
# addresses, they are different generations. 537a03xx is DDM1 (CFX3);
# 537a04xx is DDM2 (CFX5/CFX2, firmware IDs MC1/MC2/MC3). Our fridge
# advertises MC1_8d87f4, so it is DDM2. The vendored component patched the
# UUIDs correctly but still spoke DDM1 opcodes (PUB 0x00 / SUB 0x01 / PING
# 0x02) and one-byte values, where DDM2 uses PUB 0x10 / SET 0x11 / SUB 0x12
# and 32-bit little-endian values. The subscribe frame we were writing was
# never going to be parsed — which also explains why product_type made no
# difference: it was a field inside a frame the fridge ignored.
#
# The second blocker is bonding. The CFX never sends a Security Request and
# never returns an ATT auth error; it silently accepts unencrypted writes and
# simply declines to notify. The central has to initiate encryption
# unprompted, ~270ms after connect, which nothing here was doing. This fork
# handles both DDM2 and bonding.
#
# UNVALIDATED AS COMMITTED: this has not been flashed yet. On first run,
# check the fork's README — the config keys and sensor `type:` names below
# come from the old component's schema and may need renaming. Put the fridge
# into Bluetooth PAIR mode before the first flash; the initial bond requires
# it. The bond lives in NVS, so a reflash or NVS erase means PAIR mode again.
#
# The old vendored copy is still in components/ (untracked) as a fallback.
external_components:
  - source: github://philippe-a11y/esphome-dometic-cfx5
    components: [dometic_cfx_ble]

esp32_ble:
  io_capability: none # Just Works — matches what the phone app presents.
    # This is already the ESPHome default; it is set explicitly so a future
    # reader doesn't "fix" it, since bonding depends on it.

ble_client:
  - mac_address: "88:13:BF:8D:87:F6" # Replace with your Dometic fridge MAC address
    id: dometic_fridge # This ID must match your ble_client_id

dometic_cfx_ble:
  id: fridge_ble
  ble_client_id: dometic_fridge # Links the component to the defined client
  # No temperature_unit option in this fork's schema (unlike the old vendored
  # component) — it always reports native Celsius. F/C conversion happens
  # server-side in services/dometic.py instead. See git history for the
  # attempt at a firmware-level option; reverted, invalid config key.
  product_type: SZ # CFX5 35 is single-zone, no icemaker — SZ is the
                    # semantically correct choice.
                    #
                    # All three product types (SZ, SZI, DZ) were tested
                    # 2026-08-27 against the old DDM1 component with identical
                    # results: connects, discovers both characteristics,
                    # registers for notifications, writes the subscribe payload
                    # successfully at the BLE layer (ESP_GATTC_WRITE_CHAR_EVT
                    # x3 every time) — then zero RX frames, ever.
                    #
                    # That experiment correctly ruled out product_type. It is
                    # now understood to have been testing a field inside a
                    # DDM1 frame the fridge never parsed, on an unencrypted
                    # link it would not have answered anyway.

# ESPHome's built-in JSON API — GET /sensor/<id>, /binary_sensor/<id>,
# /text_sensor/<id> each return JSON. van-api polls these exactly like it
# polls the Shellys' local HTTP API (services/dometic.py). No external
# access needed, so no auth configured — same trust model as the Shellys,
# which also have no auth on their local endpoints.
web_server:
  version: 3

sensor:
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: fridge_ble
    type: COMPARTMENT_0_MEASURED_TEMPERATURE
    name: "Fridge Temperature"
    id: fridge_temp
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: fridge_ble
    type: COMPARTMENT_0_SET_TEMPERATURE
    name: "Fridge Set Temperature"
    id: fridge_set_temp
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: fridge_ble
    type: BATTERY_VOLTAGE_LEVEL
    name: "Fridge Battery Voltage"
    id: fridge_battery_voltage

binary_sensor:
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: fridge_ble
    type: COMPARTMENT_0_DOOR_OPEN
    name: "Fridge Door Open"
    id: fridge_door_open
  # Was under sensor: — real DDM2 type is INT8_BOOLEAN, and
  # decode_to_float_() has no case for booleans, so it silently returned
  # null even while the fridge was running.
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: fridge_ble
    type: COOLER_POWER
    name: "Fridge Cooler Power"
    id: fridge_cooler_power

text_sensor:
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: fridge_ble
    type: POWER_SOURCE
    name: "Fridge Power Source"
    id: fridge_power_source
  # Used by the network-follow interval below to know which network the
  # board is currently on, without any custom C++ — a real, documented
  # ESPHome platform (checked wifi_info/text_sensor.py before using it).
  - platform: wifi_info
    ssid:
      name: "Current SSID"
      id: current_ssid
