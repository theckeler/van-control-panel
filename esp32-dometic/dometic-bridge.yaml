esphome:
  name: dometic-bridge
  friendly_name: Dometic Bridge

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  ap:
    ssid: "Dometic-Bridge-Fallback"
    password: !secret fallback_ap_password

logger:
  level: VERBOSE

api:
  encryption:
    key: "4jqLcf3DaUMClV30PR5ifiJIJaeLWGhCYLqPpoWytJM=" # esphome will prompt to generate on first run

ota:
  - platform: esphome

esp32_ble_tracker:
  scan_parameters:
    # Previously interval == window (320ms/320ms) = 100% duty-cycle active
    # scanning, transmitting scan requests nonstop. The ESP32 and Pi share
    # the same van and the same 2.4GHz spectrum the Pi's own BLE connection
    # to the BMS depends on. This gives real rest between scans instead of
    # contending for airtime constantly.
    interval: 1100ms
    window: 30ms
    active: true

# Vendored, not github:// — the upstream targets CFX3 (service UUID 537a03xx).
# Patched locally to 537a04xx after confirming that block on a real CFX5 via
# BLE scan + hcidump. See components/dometic_cfx_ble/dometic_cfx_ble.cpp for
# the full story, including what's confirmed vs. extrapolated.
external_components:
  - source:
      type: local
      path: components
    components: [dometic_cfx_ble]

ble_client:
  - mac_address: "88:13:BF:8D:87:F6" # Replace with your Dometic fridge MAC address
    id: dometic_fridge # This ID must match your ble_client_id

dometic_cfx_ble:
  id: fridge_ble
  ble_client_id: dometic_fridge # Links the component to the defined client
  product_type: SZ # CFX5 35 is single-zone, no icemaker — SZ is the
                    # semantically correct choice.
                    #
                    # All three product types (SZ, SZI, DZ) were tested
                    # 2026-08-27 with identical results: connects, discovers
                    # both characteristics, registers for notifications, and
                    # successfully writes the subscribe payload at the BLE
                    # layer (ESP_GATTC_WRITE_CHAR_EVT x3 every time) — then
                    # zero RX frames, ever, on any of them. Confirmed the
                    # payload's product-type byte does change correctly per
                    # value (01/02/03), so the write itself is not the
                    # problem.
                    #
                    # That pattern rules out "wrong product_type" and points
                    # toward the fridge requiring real bonding/pairing before
                    # it trusts a peer enough to send data. This client's
                    # IO Capability is "none" — no pairing is attempted at
                    # all, just an open, unauthenticated GATT connection.
                    # Adding real BLE bonding would be genuine new C++ work
                    # in the vendored component, a separate project from
                    # this debugging session.

# ESPHome's built-in JSON API — GET /sensor/<id>, /binary_sensor/<id>,
# /text_sensor/<id> each return JSON. van-api polls these exactly like it
# polls the Shellys' local HTTP API (services/dometic.py). No external
# access needed, so no auth configured — same trust model as the Shellys,
# which also have no auth on their local endpoints.
web_server:
  version: 3

sensor:
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: fridge_ble
    type: COMPARTMENT_0_MEASURED_TEMPERATURE
    name: "Fridge Temperature"
    id: fridge_temp
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: fridge_ble
    type: COMPARTMENT_0_SET_TEMPERATURE
    name: "Fridge Set Temperature"
    id: fridge_set_temp
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: fridge_ble
    type: BATTERY_VOLTAGE_LEVEL
    name: "Fridge Battery Voltage"
    id: fridge_battery_voltage
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: fridge_ble
    type: COOLER_POWER
    name: "Fridge Cooler Power"
    id: fridge_cooler_power

binary_sensor:
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: fridge_ble
    type: COMPARTMENT_0_DOOR_OPEN
    name: "Fridge Door Open"
    id: fridge_door_open

text_sensor:
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: fridge_ble
    type: POWER_SOURCE
    name: "Fridge Power Source"
    id: fridge_power_source
