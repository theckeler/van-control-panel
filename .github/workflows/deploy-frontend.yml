name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, van-pi]

    steps:
      - name: Sync to latest
        working-directory: /home/todd/van-control-panel
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install Node dependencies
        working-directory: /home/todd/van-control-panel/frontend
        run: npm install --include=dev --prefer-offline

      - name: Build
        working-directory: /home/todd/van-control-panel/frontend
        run: npm run build

      - name: Restart frontend service
        run: sudo systemctl restart van-frontend
